<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire VIP Menu Tool</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; user-select: none; }
        body { background: #0f0c20; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; overflow-x: hidden; }
        
        .card { 
            background: #1a1635; 
            width: 100%; 
            max-width: 400px; 
            border-radius: 16px; 
            padding: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            border: 1px solid #2d2654; 
            position: relative;
        }
        
        h2 { text-align: center; color: #ff3366; font-size: 22px; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        p.subtitle { text-align: center; color: #8a85a5; font-size: 13px; margin-bottom: 20px; }
        .section-title { font-size: 14px; color: #ffb86c; margin: 15px 0 10px; text-transform: uppercase; font-weight: bold; }
        
        /* Chức năng & Hiệu ứng */
        .option-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            background: #231e45; 
            padding: 12px 15px; 
            border-radius: 10px; 
            margin-bottom: 10px;
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }
        
        /* Hiệu ứng khi BẬT */
        .option-item.active {
            background: #193836;
            border-color: #00e676;
            box-shadow: 0 0 15px rgba(0, 230, 118, 0.4);
            animation: pulse 0.4s ease-in-out;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }

        .option-item span { font-size: 14px; font-weight: 500; }
        
        /* Switch */
        .switch { position: relative; display: inline-block; width: 46px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #3b336a; transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #00e676; }
        input:checked + .slider:before { transform: translateX(22px); }

        /* Nút game */
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .game-btn { flex: 1; padding: 14px; border: none; border-radius: 10px; font-weight: bold; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: white; transition: 0.2s; text-align: center; }
        .btn-ff { background: linear-gradient(45deg, #ff416c, #ff4b2b); }
        .btn-ffmax { background: linear-gradient(45deg, #8a2be2, #4a00e0); }
        .game-btn:active { transform: scale(0.96); }
        
        #status { text-align: center; font-size: 12px; color: #00e676; margin-top: 10px; height: 16px; }
        .music-tip { text-align: center; font-size: 11px; color: #ffb86c; margin-top: 15px; opacity: 0.8; }
    </style>
</head>
<body>

<div class="card">
    <h2>FREE FIRE MENU VIP</h2>
    <p class="subtitle">Trình Tối Ưu Hóa & Kích Hoạt Cấu Hình Game</p>

    <div class="section-title">Cấu hình chức năng</div>

    <div class="option-item" id="opt-1">
        <span>Tăng Nhạy Màn Hình</span>
        <label class="switch"><input type="checkbox" onchange="toggleFeature('Tăng nhạy màn hình', this, 'opt-1')"><span class="slider"></span></label>
    </div>
    
    <div class="option-item" id="opt-2">
        <span>Ổn Định FPS (60 - 90 FPS)</span>
        <label class="switch"><input type="checkbox" onchange="toggleFeature('Ổn định FPS', this, 'opt-2')"><span class="slider"></span></label>
    </div>

    <div class="option-item" id="opt-3">
        <span>Hỗ Trợ Bám Tâm (Aim Assist)</span>
        <label class="switch"><input type="checkbox" onchange="toggleFeature('Bám tâm', this, 'opt-3')"><span class="slider"></span></label>
    </div>

    <div class="option-item" id="opt-4">
        <span>Fix Lố Tâm (Anti-Overaim)</span>
        <label class="switch"><input type="checkbox" onchange="toggleFeature('Fix lố tâm', this, 'opt-4')"><span class="slider"></span></label>
    </div>

    <div class="option-item" id="opt-5">
        <span>Fix Rung Màn Hình</span>
        <label class="switch"><input type="checkbox" onchange="toggleFeature('Fix rung màn hình', this, 'opt-5')"><span class="slider"></span></label>
    </div>

    <div id="status"></div>

    <div class="section-title">Vào Game Trực Tiếp</div>
    
    <div class="btn-group">
        <button class="game-btn btn-ff" onclick="launchGame('freefire')">🔥 FREE FIRE</button>
        <button class="game-btn btn-ffmax" onclick="launchGame('freefiremax')">⚡ FF MAX</button>
    </div>

    <div class="music-tip">🎵 Vuốt nhẹ màn hình để nghe nhạc "Tìm Em"</div>
</div>

<!-- Thư viện âm thanh nhạc Tìm Em (Đoạn nữ hát) -->
<audio id="bgMusic" loop preload="auto">
    <source src="https://files.catbox.moe/k210m5.mp3" type="audio/mpeg">
</audio>

<script>
    var audio = document.getElementById("bgMusic");
    var hasPlayed = false;

    // Phát nhạc khi người dùng lướt nhẹ / chạm kéo màn hình
    function playMusicOnGesture() {
        if (!hasPlayed) {
            audio.play().then(() => {
                hasPlayed = true;
            }).catch(e => console.log("Cần thao tác thêm để phát nhạc"));
        }
    }

    // Bắt sự kiện vuốt/lướt màn hình trên điện thoại và chuột
    window.addEventListener('touchstart', playMusicOnGesture);
    window.addEventListener('touchmove', playMusicOnGesture);
    window.addEventListener('scroll', playMusicOnGesture);
    window.addEventListener('click', playMusicOnGesture);

    // Bật tắt chức năng có hiệu ứng lóe sáng
    function toggleFeature(name, el, elementId) {
        var status = document.getElementById('status');
        var container = document.getElementById(elementId);

        playMusicOnGesture(); // Kích hoạt nhạc nếu chưa phát

        if(el.checked) {
            container.classList.add('active');
            status.innerText = "⚡ Đã bật: " + name;
            status.style.color = "#00e676";
        } else {
            container.classList.remove('active');
            status.innerText = "❌ Đã tắt: " + name;
            status.style.color = "#ff5252";
        }
        setTimeout(() => { status.innerText = ""; }, 2000);
    }

    function launchGame(type) {
        var urlScheme = (type === 'freefire') ? "freefire://" : "freefiremax://";
        window.location.href = urlScheme;
        setTimeout(function() {
            alert("Đang khởi chạy " + (type === 'freefire' ? "Free Fire" : "Free Fire MAX") + "... Nhớ cài sẵn ứng dụng trên máy nhé!");
        }, 1500);
    }
</script>

</body>
</html>
